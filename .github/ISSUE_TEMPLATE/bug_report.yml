name: Bug Report
description: Something isn't working correctly
labels: ["bug", "needs-triage"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report a bug. Please fill in all sections — incomplete reports may be closed without action.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: "When I click 'Play now', the page shows a blank screen instead of loading the game."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: "The game set picker should appear."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Step-by-step instructions to reproduce the bug consistently.
      placeholder: |
        1. Go to the homepage
        2. Click "Play now"
        3. See error
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Which game is affected?
      options:
        - Guess the Cricketer (/play/guess)
        - Unscramble the Name (/play/unscramble)
        - Admin panel (/admin)
        - Leaderboard (/leaderboard)
        - Homepage
        - Other / Not game-specific
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production (live site)
        - Local development
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Chrome 126 on macOS 14, or Safari on iOS 17"
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console errors (if any)
      description: Open DevTools (F12) → Console tab. Paste any red error messages here.
      render: text
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Screenshots, screen recordings, or anything else that might help.
    validations:
      required: false
